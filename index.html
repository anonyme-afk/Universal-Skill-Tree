<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Skill Tree (UST)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background-color: #1e293b;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 16px;
        }
        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 24px;
        }
        code {
            background-color: #020617;
            padding: 4px 8px;
            border-radius: 6px;
            color: #f43f5e;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Universal Skill Tree 🌳</h1>
        <p>Le framework Plug &amp; Play pour connecter n'importe quel LLM / agent à votre ordinateur.</p>
        <p>Pour exécuter la suite de tests ou le CLI, veuillez utiliser la console de commande :</p>
        <p><code>python -m pytest tests/</code> ou <code>ust --help</code></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
